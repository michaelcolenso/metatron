<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>photos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23111'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23fff' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <!-- Trigger deployment -->
</head>

<body>
  <header>
    <h1>you can't see your own ears</h1>
    <div class="controls">
      <div class="search-box">
        <input type="text" id="search" placeholder="Search images...">
      </div>
      <div class="sort-controls">
        <label for="sort">Sort by:</label>
        <select id="sort">
          <option value="date-desc">Newest First</option>
          <option value="date-asc">Oldest First</option>
          <option value="name">Name</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <div id="photo-grid" class="layout-masonry"></div>
  </main>

  <footer>
    <p>© <span id="year"></span> Photography Portfolio. All rights reserved.</p>
  </footer>

  <!-- Modal for image preview -->
  <div id="modal" class="modal">
    <span class="close">&times;</span>
    <picture id="modal-picture">
      <img class="modal-content" id="modal-img">
    </picture>
    <div id="modal-caption"></div>
  </div>

  <script src="images.js"></script>
  <script src="script.js"></script>
</body>

</html>
